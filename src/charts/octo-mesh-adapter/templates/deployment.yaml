{{- include "checkMandatoryValue" (dict "name" "communicationControllerServiceUri" "value" .Values.communicationControllerServiceUri) }}
{{- $key := include "octo-mesh.adapterFullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "octo-mesh.adapterFullname" .  }}
  labels:
    {{- include "octo-mesh.service-labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "octo-mesh.service-selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "octo-mesh.service-labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # AB#4917: the adapter SDK's graceful shutdown (drain running pipeline
      # executions) can take far longer than the k8s default of 30s — give it
      # a values-driven budget so scale-to-zero drains cleanly.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 180 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.secrets.rootCa }}
      # InitContainer to update CA certificates
      initContainers:
        - name: update-ca-certs
          image: alpine:latest
          command:
            - sh
            - -c
            - |
              # 🔴 AB#5303 item 3 — `set -e`, and no network. The previous version ran
              # `apk add ca-certificates` first; when that failed on a transient DNS error the
              # script carried on, `update-ca-certificates` was not found, the CA was NEVER merged,
              # and the last line still printed "✓ CA certificates updated successfully" and exited
              # 0. Measured on a local kind cluster 2026-09-28: two of three running adapter pods
              # carried the stock 119-certificate bundle and failed to verify the controller's
              # certificate. They stayed connected only because the SDK's hub transport bypassed
              # validation unconditionally — so a trust mechanism that fails open was hidden by a
              # transport that never checked. Both halves are fixed; this is the half that must not
              # lie.
              set -eu

              echo "=== CA certificate setup ==="

              if [ ! -s /mounted-certs/root-ca.pem ]; then
                echo "ERROR: /mounted-certs/root-ca.pem is missing or empty." >&2
                exit 1
              fi

              # `|| true`: grep exits 1 on zero matches, and under `set -e` that would kill the
              # container with an EMPTY log — a crash loop nobody can diagnose. Measured; keep it.
              added=$(grep -c "BEGIN CERTIFICATE" /mounted-certs/root-ca.pem || true)
              if [ "$added" -lt 1 ]; then
                echo "ERROR: /mounted-certs/root-ca.pem contains no PEM certificate." >&2
                exit 1
              fi
              echo "Certificates to add: $added"

              # alpine ships ca-certificates-bundle, so the stock bundle is present without apk and
              # without a network round trip. Appending is all update-ca-certificates would do.
              base=/etc/ssl/certs/ca-certificates.crt
              if [ ! -s "$base" ]; then
                echo "ERROR: no stock CA bundle at $base in this image." >&2
                exit 1
              fi

              before=$(grep -c "BEGIN CERTIFICATE" "$base")

              cp -r /etc/ssl/certs/. /shared-certs/
              cat "$base" /mounted-certs/root-ca.pem > /shared-certs/ca-certificates.crt

              after=$(grep -c "BEGIN CERTIFICATE" /shared-certs/ca-certificates.crt)
              echo "Bundle: $before -> $after certificates"

              # The assertion the old script lacked. Counting is enough and needs no openssl: the
              # failure being guarded against is "nothing was merged", not a malformed PEM.
              expected=$((before + added))
              if [ "$after" -ne "$expected" ]; then
                echo "ERROR: expected $expected certificates in the merged bundle, found $after." >&2
                exit 1
              fi

              echo "✓ CA certificates merged into the shared trust store"
          volumeMounts:
            - name: custom-ca-certs
              mountPath: /mounted-certs
              readOnly: true
            - name: updated-ca-certs
              mountPath: /shared-certs
      {{- end }}
      containers:
      - name: mesh-adapter
        {{- if .Values.image.privateRegistry }}
        image: "{{ .Values.image.privateRegistry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        {{- else }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        {{- end }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
          - name: http
            containerPort: {{ .Values.service.port }}
            protocol: TCP
        env:
          {{- include "octo-mesh.env" . | nindent 8 }}
        {{- with .Values.livenessProbe}}
        livenessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.readinessProbe}}
        readinessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.resources}}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if or .Values.volumeMounts .Values.secrets.rootCa }}
        volumeMounts:
        {{- end }}
        {{- with .Values.volumeMounts }}
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if .Values.secrets.rootCa }}
        - name: updated-ca-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        {{- end }}
      {{- if or .Values.volumes .Values.secrets.rootCa }}
      volumes:
      {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.secrets.rootCa }}
      - name: custom-ca-certs
        secret:
          secretName: {{ printf "%s-ca" (include "octo-mesh.fullname" .) }}
      - name: updated-ca-certs
        emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
