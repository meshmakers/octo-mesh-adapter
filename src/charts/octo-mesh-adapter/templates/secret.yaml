{{- /*
  Chart-owned `<fullname>-backend` Secret. Holds plaintext credentials for
  legacy installs that pass `.Values.secrets.*` as strings. The resource
  is skipped entirely when every secret is sourced externally (operator-
  managed secret, External Secrets, etc.) via a `valueFrom` map — in that
  case `_env.tpl` references those Secrets directly and no chart-owned
  Secret is needed.
*/ -}}
{{- /*
  🔴 AB#4924 E3 — a pool member's Secret never carries the installation's database or
  CrateDB passwords or the SECRET key ring, even when a values file supplies them. The
  container env already withholds them (_env.tpl); without the same guard here a
  hand-written or regressed values file would still have packed them into
  `<fullname>-backend`, readable by anything that can read Secrets in the member's
  namespace. The IronOCR licence (E3: yes) does not live in this Secret at all.
  Pinned by tests/chart/test-chart.sh.
*/ -}}
{{- $member := include "octo-mesh.isPoolMember" . }}
{{- if include "octo-mesh.hasPlaintextBackendSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backend" (include "octo-mesh.fullname" .) }}
  labels:
    {{- include "octo-mesh.labels" . | nindent 4 }}
type: Opaque
data:
{{- if and (not $member) .Values.secrets.databaseUser (not (kindIs "map" .Values.secrets.databaseUser)) }}
  databaseUser: {{ .Values.secrets.databaseUser | b64enc | quote }}
{{- end }}
{{- if and (not $member) .Values.secrets.databaseAdmin (not (kindIs "map" .Values.secrets.databaseAdmin)) }}
  databaseAdmin: {{ .Values.secrets.databaseAdmin | b64enc | quote }}
{{- end }}
{{- if and (not $member) .Values.secrets.streamDataPassword (not (kindIs "map" .Values.secrets.streamDataPassword)) }}
  streamDataPassword: {{ .Values.secrets.streamDataPassword | b64enc | quote }}
{{- end }}
{{- if and .Values.secrets.rabbitmq (not (kindIs "map" .Values.secrets.rabbitmq)) }}
  rabbitmq: {{ .Values.secrets.rabbitmq | b64enc | quote }}
{{- end }}
{{- /*
  AB#5072. Only reachable on the legacy plaintext path (a hand-written values
  file); the operator-driven deploy always hands this value in as a
  `valueFrom` map pointing at `{release}-octo-secrets`, and then this key is
  skipped like every other externally sourced secret.
*/}}
{{- if and .Values.secrets.serviceAccountClientSecret (not (kindIs "map" .Values.secrets.serviceAccountClientSecret)) }}
  serviceAccountClientSecret: {{ .Values.secrets.serviceAccountClientSecret | b64enc | quote }}
{{- end }}
{{- /* AB#5536 — SECRET key ring, legacy plaintext path only (hand-written values). */}}
{{- $se := .Values.secrets.secretEncryption | default dict }}
{{- if $member }}{{- $se = dict }}{{- end }}
{{- range $kid, $value := ($se.keys | default dict) }}
{{- if and $value (not (kindIs "map" $value)) }}
  {{ printf "secretEncryptionKey-%s" $kid }}: {{ $value | b64enc | quote }}
{{- end }}
{{- end }}
{{- if and $se.legacyV1Key (not (kindIs "map" $se.legacyV1Key)) }}
  secretEncryptionLegacyV1Key: {{ $se.legacyV1Key | b64enc | quote }}
{{- end }}
{{- end }}
---
{{- if .Values.secrets.rootCa }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-ca" (include "octo-mesh.fullname" .) }}
  labels:
    {{- include "octo-mesh.labels" . | nindent 4 }}
type: Opaque
data:
  {{- include "checkMandatoryValue" (dict "name" "secrets.rootCa" "value" .Values.secrets.rootCa) }}
  root-ca.pem: {{ .Values.secrets.rootCa | b64enc | quote }}
{{- end }}