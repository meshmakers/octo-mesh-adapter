# Default values for octoMeshAdapter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Pod termination grace period in seconds. The adapter SDK's graceful shutdown
# (draining running pipeline executions) may need up to a few minutes; the k8s
# default of 30s would SIGKILL mid-drain (AB#4917, on-demand lifecycle).
terminationGracePeriodSeconds: 180

# Tenant id the adapter is executing
tenantId: ""

# Runtime id of adapter in database
adapterRtId: ""
  
# The communication controller service uri
communicationControllerServiceUri: ""

# The URI of the reporting service - when possible use the internal service name of kubernetes
reportingServiceUri: ""

# The public uri of the oauth service - issues the access tokens accepted by secured trigger nodes
authUri: ""

# The public uri of the adapter
publicUri: ""

# The unique instance prefix of the OctoMesh installation.
instancePrefix: ""

secrets:
  databaseUser: ""
  databaseAdmin: ""
  streamDataPassword: ""  
  rabbitmq: ""
  # content of the root ca certificate chain
  rootCa: ""

clusterDependencies:
  mongodbHost: "octo-mongodb-0.octo-mongodb-svc.mongodb.svc.cluster.local:27017,octo-mongodb-1.octo-mongodb-svc.mongodb.svc.cluster.local:27017,octo-mongodb-2.octo-mongodb-svc.mongodb.svc.cluster.local:27017"
  rabbitMqHost: "rabbitmq.rabbitmq.svc.cluster.local"
  rabbitMqUser: "octo-mq-user"
  streamDataHost: "crate-octo-crate.cratedb.svc.cluster.local"
  streamDataUser: "octo-system"
  # Instance-level StreamData kill switch (StreamDataInstanceConfiguration.Enabled).
  # Default false → matches the C# default, feature is opt-in per cluster. Set to
  # true in clusters that run CrateDB and want adapter nodes such as
  # SaveStreamDataInArchive to be functional.
  streamDataEnabled: false
  # Instance isolation (Epic AB#4944), both supplied by the communication operator from
  # its own OperatorOptions.ClusterDependencies. Empty = single-instance cluster: the
  # adapter keeps its compiled-in system database ("OctoSystem") and the unprefixed
  # CrateDB schema names, so existing installations render byte-identically.
  # Set them together with the core services' serviceDefaults.systemDatabaseName /
  # clusterDependencies.streamDataSchemaInstancePrefix when running a second instance.
  systemDatabaseName: ""
  streamDataSchemaInstancePrefix: ""

image:
  repository: meshmakers/octo-mesh-adapter
  pullPolicy: IfNotPresent
  # private registry to pull images from
  privateRegistry: ""
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

# A memory LIMIT is deliberately set so an adapter can never consume a whole
# node's memory. Without it the mesh adapter grew unbounded during heavy work
# (e.g. the accounting PDF-OCR + AI analysis batches — ~1.4Gi idle plus spikes)
# and the kernel OOM-killer terminated a random pod once the node hit memory
# pressure (prod-1 meshmakers, 2026-07-24). The limit converts an unpredictable
# NODE-level OOM into an isolated, fast-restarting CONTAINER-level OOM. The
# request makes scheduling memory-aware so the operator does not pack too many
# adapters onto one node. Heavy per-tenant adapters (accounting) should raise
# these via a per-workload override; light adapters stay well under the ceiling.
# No CPU limit on purpose (CPU throttling hurts latency; memory is the OOM lever).
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 3Gi

livenessProbe:
  httpGet:
    path: /healthz/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /healthz/ready
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations:
    # Adapters routinely receive document uploads, and ingress-nginx's 1m default body
    # limit rejects a 2 MB invoice with a 413 that carries no CORS headers - a browser
    # can only report that as a bare network error, which misdirects every diagnosis
    # (AB#4967). 25m is the value the operator documentation already uses as its
    # example. Override per workload or cluster-wide via the operator's ingress
    # annotation projection; the key merges with (and is overridden by) same-key
    # values from either layer.
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  tls: false
  tlsExtra: []
#  tlsExtra:
#    - hosts:
#        - "*.example.com"
#      secretName: example-com-certificate