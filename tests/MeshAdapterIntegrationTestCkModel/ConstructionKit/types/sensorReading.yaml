$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
- typeId: SensorReading
  derivedFromCkTypeId: ${System}/Entity
  attributes:
  - id: ${this}/SerialNumber
    name: SerialNumber
  - id: ${this}/Temperature
    name: Temperature
    isOptional: true
  - id: ${this}/Amount
    name: Amount
    isOptional: true
  - id: ${this}/Quality
    name: Quality
    isOptional: true
  - id: ${this}/SourceDate
    name: SourceDate
    isOptional: true
  # AB#8049: never readable, filterable or sortable outside a CK method (stored-query access tests)
  - id: ${this}/ReadingSecret
    name: ReadingSecret
    isOptional: true
    access: Hidden
